<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Het Chikhaliya</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Match the theme the visitor chose on the main site (same origin); runs before first paint.
      try {
        if (localStorage.getItem('portfolio-theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Self-contained: this page is served outside the Vite bundle. */
      :root {
        color-scheme: dark;
        --bg: #0a0c11;
        --surface: #12161f;
        --text: #e9ecf3;
        --muted: #98a2b5;
        --faint: #8590a3;
        --border: rgba(255, 255, 255, 0.09);
        --accent: #6d8cff;
        --accent-2: #35d6c4;
        --grid: rgba(255, 255, 255, 0.035);
      }

      :root[data-theme='light'] {
        color-scheme: light;
        --bg: #f6f7fa;
        --surface: #ffffff;
        --text: #10131a;
        --muted: #566074;
        --faint: #626c7c;
        --border: rgba(16, 19, 26, 0.1);
        --accent: #3b5bdb;
        --accent-2: #0d9488;
        --grid: rgba(16, 19, 26, 0.04);
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', system-ui, sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        background-image: linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 72px 72px;
      }

      main {
        max-width: 520px;
        width: 100%;
        text-align: center;
      }

      .code {
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-size: clamp(5rem, 4rem + 8vw, 8rem);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.05em;
        background: linear-gradient(140deg, var(--accent), var(--accent-2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .path {
        margin-top: 1.25rem;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.8rem;
        color: var(--faint);
        overflow-wrap: anywhere;
      }

      h1 {
        margin-top: 0.75rem;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      p {
        margin-top: 0.75rem;
        color: var(--muted);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 2rem;
      }

      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.4rem;
        border-radius: 999px;
        border: 1px solid transparent;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        transition: transform 150ms ease, background-color 150ms ease, border-color 150ms ease;
      }

      a.btn:hover {
        transform: translateY(-2px);
      }

      .btn--primary {
        background: var(--accent);
        color: #07090f;
      }

      :root[data-theme='light'] .btn--primary {
        color: #ffffff;
      }

      .btn--ghost {
        border-color: var(--border);
        background: var(--surface);
        color: var(--text);
      }

      .btn--ghost:hover {
        border-color: var(--accent);
      }

      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <p class="path" id="path"></p>
      <h1>This page doesn't exist</h1>
      <p>The link may be outdated, or the address was typed incorrectly. Everything on this site lives on the home page.</p>
      <div class="actions">
        <a class="btn btn--primary" href="/">Back to home</a>
        <a class="btn btn--ghost" href="/#projects">View projects</a>
      </div>
    </main>
    <script>
      // Echo the requested path so the visitor can spot a typo.
      var p = document.getElementById('path');
      if (p && location.pathname !== '/') p.textContent = location.pathname;
    </script>
  </body>
</html>
