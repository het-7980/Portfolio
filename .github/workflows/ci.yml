name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build

      - name: Verify expected static files are in the build
        run: |
          for f in index.html 404.html robots.txt sitemap.xml og.png _headers _redirects; do
            test -f "dist/$f" || { echo "missing dist/$f"; exit 1; }
          done
